# Local stack: Kafka (KRaft, no ZooKeeper), MongoDB, the Scala streaming job, Airflow.
# Build the jar first:  make jar
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"   # host access, used by the Python producer
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      retries: 10

  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"

  spark-streaming:
    image: apache/spark:3.5.1-scala2.12-java17-ubuntu
    container_name: spark-streaming
    user: root
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      DATA_ROOT: /data
    volumes:
      - ./data:/data
      - ./spark-jobs/target/scala-2.12:/jars:ro
    command: >
      /opt/spark/bin/spark-submit --master local[2] --driver-memory 2g
      --class commerce.pipeline.jobs.StreamingIngestJob /jars/commerce-events-pipeline.jar
    restart: on-failure

  airflow:
    build: ./orchestration
    container_name: airflow
    user: "${AIRFLOW_UID:-50000}:0"   # Linux: put AIRFLOW_UID=$(id -u) in .env so it can write ./data
    depends_on: [mongodb]
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DATA_ROOT: /data
      MONGO_ENABLED: "true"
      MONGO_URI: mongodb://mongodb:27017
      PIPELINE_JAR: /opt/pipeline/jars/commerce-events-pipeline.jar
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./data:/data
      - ./spark-jobs/target/scala-2.12:/opt/pipeline/jars:ro
    command: standalone   # admin password is printed in `docker logs airflow`
